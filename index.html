<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>くくマスター</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="くくマスター">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* layout: 1画面アプリ。ホーム=くくバンドのステージ+段の格子 / プレイ=キャラ+問題+4択。
   ふだんは空色、全段クリア後に「ホラーモード」(body.horror)で闇色に切り替わる */
:root{
  --sky:#bfe6ff; --sky2:#e8f6ff; --ink:#23324a; --paper:#fffdf6;
  --good:#2fb36d; --bad:#ef5b5b; --gold:#ffbf2e; --shadow:#23324a33;
  --stage:#2a2350; --stage2:#463a86; --yomi:#c0567a; --tile:#ffffff;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --beat:.6s;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky),var(--sky2));color:var(--ink);font-family:var(--font);font-weight:800;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;overflow-x:hidden}
#app{position:relative;z-index:1}
button{font-family:inherit;font-weight:800;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none;padding:0}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.screen{max-width:860px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px;min-height:100%}
h1{margin:0;font-size:clamp(30px,6vw,48px);letter-spacing:.04em;text-align:center;text-wrap:balance}
h1 small{display:block;font-size:.4em;font-weight:500;letter-spacing:.1em;opacity:.75}
.sub{text-align:center;font-weight:500;margin:0}

/* ---- キャラクター ---- */
.chr{position:relative;width:var(--s,110px);flex:none}
.chr svg{display:block;width:100%;height:auto;overflow:visible}
.chr .bg{transform-origin:60px 124px;animation:bob 2.6s ease-in-out infinite}
.chr .eyes{animation:blink 4.6s infinite}
.chr .ant{animation:wob 1.4s ease-in-out infinite}
.chr .mo,.chr .sadx{display:none}
.chr.m-idle .mo-idle,.chr.m-happy .mo-happy,.chr.m-sad .mo-sad,.chr.m-sing .mo-sing{display:inline}
.chr.m-sad .sadx{display:inline}
.chr.dance .bg{animation:dance var(--beat) ease-in-out infinite}
.chr.dance .al{animation:wl var(--beat) ease-in-out infinite}
.chr.dance .ar{animation:wr var(--beat) ease-in-out infinite}
.chr.dance .ant{animation:wob calc(var(--beat)/2) ease-in-out infinite}
.chr.sad .bg{animation:flop .9s ease-out forwards}
.chr.locked svg{filter:brightness(0) invert(1) opacity(.2)}
.chr.locked .bg,.chr.locked .eyes{animation:none}
.chr.locked::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--s,110px)*.38);color:#fff9;padding-top:12%}
.chr.muted{opacity:.4;filter:grayscale(.8)}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2px) scale(1.025,.975)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes dance{0%{transform:translateY(0) scale(1.08,.9)}30%{transform:translateY(-12px) scale(.94,1.07) rotate(-4deg)}60%{transform:translateY(0) scale(1.05,.95)}80%{transform:translateY(-4px) rotate(4deg)}100%{transform:translateY(0) scale(1.08,.9)}}
@keyframes wl{0%,100%{transform:rotate(0)}50%{transform:rotate(55deg)}}
@keyframes wr{0%,100%{transform:rotate(0)}50%{transform:rotate(-55deg)}}
@keyframes flop{0%{transform:rotate(0)}30%{transform:rotate(-14deg) translateY(5px) scale(1.06,.88)}100%{transform:rotate(-7deg) translateY(3px) scale(1.02,.95)}}

/* ---- ステージ ---- */
.stage{background:radial-gradient(ellipse at 20% 0%,#ffffff22,transparent 45%),radial-gradient(ellipse at 80% 0%,#ffd6f522,transparent 45%),linear-gradient(180deg,var(--stage2),var(--stage));
  border-radius:28px;padding:16px 12px 14px;color:#fff;box-shadow:0 8px 0 #1a1536;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.stage-top{display:flex;align-items:center;gap:12px;padding:0 6px}
.stage-top .nm{flex:1;display:flex;flex-direction:column}
.stage-top .nm b{font-size:24px;letter-spacing:.08em}
.stage-top .nm span{font-size:14px;font-weight:500;opacity:.8}
.playbtn{background:var(--gold);color:#3a2300;border-radius:99px;padding:12px 22px;font-size:20px;box-shadow:0 4px 0 #a7700f}
.playbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #a7700f}
.playbtn.on{background:#ff6fb5;color:#fff;box-shadow:0 4px 0 #a83a72}
.crew{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;align-items:end;
  background:linear-gradient(180deg,transparent 70%,#ffffff14 70%);border-radius:16px;padding:6px 2px 4px}
.mem{display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;min-width:0}
.mem .chr{--s:100%}
.mem span{font-size:12px;white-space:nowrap;opacity:.9}
.stage-tip{margin:0;text-align:center;font-weight:500;font-size:15px;min-height:1.5em}
@media (max-width:640px){.crew{grid-template-columns:repeat(5,1fr);row-gap:8px}}

/* ---- ホーム ---- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dan{background:var(--c);border-radius:22px;padding:10px 10px 8px;box-shadow:0 6px 0 var(--shadow);display:grid;grid-template-columns:1fr auto;align-items:center;transition:transform .08s;text-align:left}
.dan:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.dan .num{display:flex;flex-direction:column;line-height:1}
.dan b{font-size:clamp(36px,8vw,56px)}
.dan small{font-size:14px;margin-top:2px}
.dan .chr{--s:clamp(44px,11vw,72px)}
.dan .stars{grid-column:1/3;margin-top:2px}
.stars{font-size:20px;letter-spacing:2px;color:#0002}
.stars i{font-style:normal}.stars i.on{color:var(--gold);text-shadow:0 1px 0 #a7700f}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
.big{background:var(--paper);border-radius:20px;padding:16px;font-size:22px;box-shadow:0 6px 0 var(--shadow)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.big.dark{background:var(--ink);color:var(--paper)}
.big small{display:block;font-size:14px;font-weight:500;opacity:.8;margin-top:4px}
.hbtn{background:#14070b;color:#ff4a4a;letter-spacing:.06em;text-shadow:0 0 10px #ff000099;box-shadow:0 6px 0 #000,0 0 24px #ff000055;animation:glitch 2.4s infinite}
@keyframes glitch{0%,88%,100%{transform:none;filter:none}90%{transform:translateX(-3px) skewX(6deg);filter:hue-rotate(40deg)}92%{transform:translateX(3px)}94%{transform:none;opacity:.6}96%{opacity:1}}
.top{display:flex;align-items:center;gap:10px}
.back{background:var(--paper);border-radius:14px;padding:10px 16px;font-size:18px;box-shadow:0 4px 0 var(--shadow)}
.top .ttl{flex:1;text-align:center;font-size:22px}
.spacer{width:90px}
.card{background:var(--paper);border-radius:28px;padding:24px 16px;box-shadow:0 8px 0 var(--shadow);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
.eq{font-size:clamp(48px,12vw,100px);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.eq .q{display:inline-block;min-width:1.2em;border-bottom:6px dashed currentColor;opacity:.4}
.eq .q.shown{opacity:1;border-color:transparent}
.yomi{font-size:clamp(20px,4.5vw,32px);font-weight:500;letter-spacing:.06em;color:var(--yomi);min-height:1.3em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ch{background:var(--paper);border-radius:22px;font-size:clamp(40px,10vw,64px);padding:16px 0;box-shadow:0 6px 0 var(--shadow);font-variant-numeric:tabular-nums}
.ch:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.ch.ok{background:var(--good);color:#fff}.ch.ng{background:var(--bad);color:#fff}
.bar{height:16px;background:#ffffff99;border-radius:99px;overflow:hidden}
.bar>div{height:100%;border-radius:99px;transition:width .2s linear}
.hud{display:flex;justify-content:space-between;font-size:20px;font-variant-numeric:tabular-nums}
.combo{color:#e2741d}
.qrow{display:flex;align-items:center;gap:10px}
.qrow .card{flex:1;padding-inline:10px}
.qrow .eq{font-size:clamp(38px,8.5vw,86px)}
.buddy{position:relative;display:flex;flex-direction:column;align-items:center}
.buddy .chr{--s:clamp(84px,22vw,180px)}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-30%);background:var(--tile);border-radius:16px;padding:6px 12px;font-size:18px;white-space:nowrap;box-shadow:0 3px 0 var(--shadow);z-index:2}
.bubble::after{content:"";position:absolute;left:24%;bottom:-8px;border:8px solid transparent;border-top-color:var(--tile);border-bottom:0}
.bubble:empty{display:none}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.bubble.pop{animation:bpop .35s}
@keyframes bpop{0%{transform:translateX(-30%) scale(.6)}60%{transform:translateX(-30%) scale(1.1)}100%{transform:translateX(-30%) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%}
.list div{background:var(--tile);border-radius:12px;padding:8px;font-size:20px}
.list div.miss{background:#ffe1e1;color:#5a1a1a}
.toggle{background:#ffffffaa;border-radius:14px;padding:10px 14px;font-size:18px}
.pick{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.pick button{background:var(--paper);border-radius:12px;padding:10px 0;font-size:20px;box-shadow:0 3px 0 var(--shadow)}
.pick button.cur{background:var(--c);color:#23324a;transform:translateY(2px)}
.note{font-weight:500;font-size:15px;text-align:center;opacity:.8;margin:0}
.join{background:radial-gradient(circle at 50% 40%,#fff6c9,#ffe07a 60%,#ffbf2e);color:#23324a;border-radius:28px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 #c98a12}
.join .chr{--s:170px}
.join h2{margin:0;font-size:clamp(24px,5vw,34px);text-align:center;text-wrap:balance}
.join p{margin:0;font-weight:500;text-align:center}
.awake{background:radial-gradient(circle at 50% 30%,#3a0610,#0a0204 70%);color:#ff5050;border-radius:28px;padding:22px 16px;text-align:center;box-shadow:0 8px 0 #000,0 0 40px #ff000044;animation:glitch 2s infinite}
.awake h2{margin:0 0 6px;font-size:clamp(24px,5vw,34px);text-shadow:0 0 12px #f00}
.awake p{margin:0;color:#e9d6d6;font-weight:500}
.menuhead{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
.menuhead .chr{--s:130px}
.hzone{display:flex;flex-direction:column;gap:10px}
.hzone h2{margin:0;font-size:22px;color:#ff4a4a;text-shadow:0 0 10px #f008;letter-spacing:.1em}
.hzone .big{background:linear-gradient(180deg,#3a0a14,#1a050a);color:#ffdede;box-shadow:0 6px 0 #000,0 0 18px #ff000033;text-align:left}

/* ---- ホラーモード ---- */
body.horror{
  --sky:#07040a; --sky2:#14060c; --ink:#eadada; --paper:#1d1218; --tile:#2a1820;
  --good:#7a1fa8; --bad:#c2121f; --gold:#d43a3a; --shadow:#000000cc;
  --stage:#0a0306; --stage2:#2e0710; --yomi:#ff5a5a;
  color-scheme:dark;
  background:radial-gradient(ellipse at 50% -10%,#3a0710 0%,transparent 55%),linear-gradient(180deg,var(--sky),var(--sky2));
  background-attachment:fixed}
body.horror::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 20% 30%,#ff000014,transparent 30%),radial-gradient(circle at 80% 70%,#6a00ff12,transparent 35%),radial-gradient(circle at 50% 90%,#ffffff0a,transparent 40%);
  animation:fog 14s ease-in-out infinite alternate}
body.horror::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 55%,#000000b0 100%)}
@keyframes fog{0%{transform:translate(0,0) scale(1)}100%{transform:translate(6%,-4%) scale(1.15)}}
body.horror h1{color:#e8d0d0;text-shadow:0 0 14px #ff0000aa,2px 0 #ff000066,-2px 0 #00ffff22;animation:flicker 4s infinite}
body.horror h1 small{color:#ff5a5a;opacity:1}
@keyframes flicker{0%,19%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}21%{opacity:.9}}
body.horror .dan{background:linear-gradient(180deg,#26141c,#130a0f);color:#e8d6d6;box-shadow:0 6px 0 #000,inset 0 0 0 2px #3a1a24}
body.horror .stars{color:#ffffff1a}
body.horror .stars i.on{color:#ff3b3b;text-shadow:0 0 8px #f00}
body.horror .stage{box-shadow:0 8px 0 #000,0 0 30px #ff000022}
body.horror .stage .playbtn{color:#fff;box-shadow:0 4px 0 #5a0a0a}
body.horror .stage .playbtn.on{background:#5a1a8a;box-shadow:0 4px 0 #2a0a4a}
body.horror .toggle{background:#ffffff14}
body.horror .bar{background:#ffffff14}
body.horror .combo{color:#ff6a3a}
body.horror .card{box-shadow:0 8px 0 #000,inset 0 0 40px #00000088}
body.horror .big.dark{background:#5a0a14;color:#ffe}
body.horror .bubble{color:#ff9a9a}
body.horror .chr .bg{animation:creep 3.4s ease-in-out infinite}
body.horror .chr.dance .bg{animation:hdance var(--beat) steps(4,jump-none) infinite}
body.horror .chr .glow{animation:glow 1.6s ease-in-out infinite}
body.horror .chr .flick{animation:flicker 2.2s infinite}
@keyframes creep{0%,100%{transform:rotate(-2deg) translateY(0)}45%{transform:rotate(2deg) translateY(-2px)}88%{transform:rotate(2deg)}90%{transform:rotate(-7deg) translateX(-2px)}92%{transform:rotate(5deg) translateX(2px)}94%{transform:rotate(0)}}
@keyframes hdance{0%{transform:translateY(0) scale(1.1,.86) rotate(-6deg)}33%{transform:translateY(-10px) scale(.92,1.1) rotate(8deg)}66%{transform:translateY(0) skewX(-8deg) scale(1.05,.95)}100%{transform:translateY(-3px) rotate(-10deg)}}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.6}}
.scare{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle,#4a0010,#000 70%);animation:scareIn .7s forwards;pointer-events:none}
.scare .chr{--s:min(90vw,80vh);animation:jolt .06s infinite}
@keyframes scareIn{0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(1.15)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
@keyframes jolt{0%{transform:translate(-6px,3px) rotate(-2deg)}50%{transform:translate(6px,-3px) rotate(2deg)}100%{transform:translate(-3px,-2px)}}

@media (max-width:420px){.grid{gap:8px}.pick{grid-template-columns:repeat(5,1fr)}.spacer{width:0}}
@media (prefers-reduced-motion:reduce){.pop,.shake,.chr .bg,.chr .eyes,.chr .ant,.chr .al,.chr .ar,.hbtn,.awake,body.horror h1,body.horror::before{animation:none!important}.bar>div{transition:none}}
</style>
</head>

<div id="app"></div>

<script>
const COLORS=["#ffd6e0","#ffe0a8","#fff1a1","#c9f2b5","#b5eedd","#b8dcff","#d4c8ff","#f5c6f0","#ffc9b0"];
const YOMI=[
["いんいちがいち","いんにがに","いんさんがさん","いんしがし","いんごがご","いんろくがろく","いんしちがしち","いんはちがはち","いんくがく"],
["にいちがに","ににんがし","にさんがろく","にしがはち","にごじゅう","にろくじゅうに","にしちじゅうし","にはちじゅうろく","にくじゅうはち"],
["さんいちがさん","さんにがろく","さざんがく","さんしじゅうに","さんごじゅうご","さぶろくじゅうはち","さんしちにじゅういち","さんぱにじゅうし","さんくにじゅうしち"],
["しいちがし","しにがはち","しさんじゅうに","ししじゅうろく","しごにじゅう","しろくにじゅうし","ししちにじゅうはち","しはさんじゅうに","しくさんじゅうろく"],
["ごいちがご","ごにじゅう","ごさんじゅうご","ごしにじゅう","ごごにじゅうご","ごろくさんじゅう","ごしちさんじゅうご","ごはしじゅう","ごっくしじゅうご"],
["ろくいちがろく","ろくにじゅうに","ろくさんじゅうはち","ろくしにじゅうし","ろくごさんじゅう","ろくろくさんじゅうろく","ろくしちしじゅうに","ろくはしじゅうはち","ろっくごじゅうし"],

let save={stars:{},miss:{},sound:true,yomi:true,horror:false,hst:0,hbest:0};
try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
const unlocked=i=>(save.stars[i+1]||0)>=1;
const allClear=()=>[0,1,2,3,4,5,6,7,8].every(unlocked);
const H=()=>!!save.horror&&allClear();
const pick=a=>a[Math.random()*a.length|0];

/* ================= キャラクター ================= */
function mix(hex,to,a){const p=s=>parseInt(s,16),c=[1,3,5].map(i=>p(hex.substr(i,2))),t=[1,3,5].map(i=>p(to.substr(i,2)));
  return "#"+c.map((v,k)=>Math.round(v+(t[k]-v)*a).toString(16).padStart(2,"0")).join("")}
const SH={
  round:"M60 22 C92 22 106 50 106 80 C106 108 86 120 60 120 C34 120 14 108 14 80 C14 50 28 22 60 22Z",
  pill:"M60 10 C84 10 92 28 92 50 L92 98 C92 114 80 120 60 120 C40 120 28 114 28 98 L28 50 C28 28 36 10 60 10Z",
  blob:"M60 40 C92 38 114 62 112 90 C110 114 90 120 60 120 C30 120 10 114 8 90 C6 62 28 42 60 40Z",
  small:"M60 58 C83 58 97 72 97 91 C97 111 81 120 60 120 C39 120 23 111 23 91 C23 72 37 58 60 58Z",
  cloud:"M30 64 C24 44 46 30 58 40 C66 24 92 28 92 48 C110 48 114 70 104 80 C114 96 102 118 84 116 C72 124 48 124 36 116 C18 118 6 96 18 84 C8 74 16 60 30 64Z",
  robo:"M30 30 H90 Q104 30 104 44 V106 Q104 120 90 120 H30 Q16 120 16 106 V44 Q16 30 30 30Z",
  pear:"M60 16 C80 16 88 32 86 50 C102 64 108 84 104 100 C100 116 84 120 60 120 C36 120 20 116 16 100 C12 84 18 64 34 50 C32 32 40 16 60 16Z",
  drop:"M60 8 C66 28 100 42 102 78 C104 108 84 120 60 120 C36 120 16 108 18 78 C20 42 54 28 60 8Z",
  boss:"M24 58 C24 32 40 22 60 22 C80 22 96 32 96 58 L98 104 C98 116 88 120 60 120 C32 120 22 116 22 104Z"
};
const CH=[
 {n:"ドドン",inst:"ドラム",c:"#ff5a5f",sh:"round",ey:66,gap:17,r:10.5,arm:[16,84,104,84],
  back:`<path d="M40 34 C30 20 33 9 41 6 C43 16 48 24 51 29Z" fill="#fff3d6" stroke="#e8c98f" stroke-width="2"/><path d="M80 34 C90 20 87 9 79 6 C77 16 72 24 69 29Z" fill="#fff3d6" stroke="#e8c98f" stroke-width="2"/>`,
  front:`<ellipse cx="60" cy="102" rx="25" ry="13" fill="#fff" opacity=".28"/>`},

      <div class="card" id="cd">
        <div class="eq">${d} × ${i} = ${hide?`<span class="q">?</span>`:d*i}</div>
        <div class="yomi">${hide?"・・・":YOMI[d-1][i-1]}</div>
      </div></div>
      <div class="row">
        <button class="big" id="prev">← まえ</button>
        <button class="big" style="${H()?"":`background:${c};color:#23324a`}" id="say">こえで きく</button>
        <button class="big" id="next">つぎ →</button>
      </div>
      <div class="row"><button class="toggle" id="hd">こたえを ${hide?"みせる":"かくす"}</button></div>
      <p class="note">「こたえを かくす」にして、こえに だして いってから「みせる」で たしかめよう</p>
    </div>`);
    bk.onclick=()=>menu(d);
    prev.onclick=()=>{i=i>1?i-1:9;draw();auto()};
    next.onclick=()=>{i=i<9?i+1:1;draw();auto()};
    say.onclick=()=>{sayKuku(d,i);sing(app.querySelector(".buddy .chr"))};
    hd.onclick=()=>{hide=!hide;draw()};
    cd.onclick=()=>{if(hide){hide=false;draw();auto()}};
    app.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>{i=+b.dataset.k;draw();auto()});
  }
  function sing(el){if(!el)return;setMood(el,"sing");el.classList.add("dance");setTimeout(()=>{el.classList.remove("dance");setMood(el,"idle")},1300)}
  function auto(){ if(!hide){sayKuku(d,i);sing(app.querySelector(".buddy .chr"))} }
  draw();
}

/* ---- クイズ ---- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function makeChoices(a,b){
  const ans=a*b,set=new Set([ans]);
  const cands=[a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+1,ans-1,ans+10,ans-10,a*(b+2)].filter(x=>x>0&&x!==ans&&x<=90);
  shuffle(cands);for(const x of cands){if(set.size>=4)break;set.add(x)}
  while(set.size<4)set.add(1+(Math.random()*81|0));
  return shuffle([...set]);
}
function smallChoices(ans){const set=new Set([ans]);const c=shuffle([ans-1,ans+1,ans-2,ans+2,ans+3,ans-3].filter(x=>x>=1&&x<=9));for(const x of c){if(set.size>=4)break;set.add(x)}return shuffle([...set])}
const ansOf=q=>q[2]==="a"?q[0]:q[2]==="b"?q[1]:q[0]*q[1];
function genQ(dans,fill){return [pick(dans),1+(Math.random()*9|0),fill?pick(["a","b","c"]):"c"]}
function weakQuiz(){
  const list=Object.entries(save.miss).filter(([,v])=>v>0).sort((x,y)=>y[1]-x[1]).slice(0,10).map(([k])=>k.split("x").map(Number));
  if(!list.length){
    h(`<div class="screen"><div class="top"><button class="back" id="bk">← もどる</button><div class="ttl">にがて チャレンジ</div><span class="spacer"></span></div>
      <div class="card">${chrSVG(4,"m-happy")}<div class="eq" style="font-size:52px">にがて なし！</div><p class="note">まちがえた もんだいが ここに あつまるよ。まずは だんの チャレンジを やってみよう。</p></div></div>`);
    bk.onclick=home;return;
  }
  quiz({title:"にがて チャレンジ",fixed:list,n:list.length,color:"#ffc9b0",weak:true});
}
const CHEER=["いいね！","せいかい！","ナイス！","やったね！"],HOT=["ノってきた！","とまらない！","さいこう！","バンド もりあがり！"],OOPS=["どんまい！","つぎ いこう！","おしい！"];
const HCHEER=["…せいかい…","ククク… やるね","まだ にがさない…","…ふーん"],HHOT=["…こわく ないの？","ヒヒヒ… つよいね","やみが ざわめく…"],HOOPS=["…まちがえたね…","つかまえた…","ヒヒヒ…","にげられないよ…"];
function quiz(opt){
  const hz=H();
  let qs;
  if(opt.fixed)qs=shuffle(opt.fixed.map(([a,b])=>[a,b,"c"]));
  else if(opt.ordered)qs=[1,2,3,4,5,6,7,8,9].map(b=>[opt.dans[0],b,"c"]);
  else if(opt.survival)qs=[];
  else{const all=[];opt.dans.forEach(a=>{for(let b=1;b<=9;b++)all.push([a,b,opt.fill?pick(["a","b","c"]):"c"])});shuffle(all);qs=all.slice(0,opt.n);
    while(qs.length<opt.n)qs.push(genQ(opt.dans,opt.fill));}
  const mates=CH.map((_,i)=>i).filter(unlocked);
  const buddy=opt.buddy!=null?opt.buddy:(mates.length?pick(mates):0);
  let idx=0,score=0,combo=0,best=0,log=[],timer=null,limit=10,left=10,t0=Date.now(),locked=false,lives=3;
  function draw(){
    if(opt.survival&&idx>=qs.length)qs.push(genQ(opt.dans,true));
    const q=qs[idx],[a,b,bl]=q,ans=ansOf(q),ch=bl==="c"?makeChoices(a,b):smallChoices(ans);
    limit=opt.survival?Math.max(2.8,7-idx*.18):(opt.limit||10);
    locked=false;left=limit;
    const slot=`<span class="q" id="qa">?</span>`;
    const eq=`${bl==="a"?slot:a} × ${bl==="b"?slot:b} = ${bl==="c"?slot:a*b}`;
    const L=hz?HCHEER:CHEER;
    h(`<div class="screen">
      <div class="top"><button class="back" id="bk">← やめる</button><div class="ttl">${opt.title}</div><span class="spacer"></span></div>
      <div class="hud"><span>${opt.survival?`${idx+1} もんめ`:`${idx+1} / ${qs.length} もん`}</span><span class="combo">${combo>=2?combo+" れんぞく！":""}</span><span>${opt.survival?"🕯️".repeat(lives)+"💀".repeat(3-lives):"⭕ "+score}</span></div>
      <div class="bar"><div id="tb" style="width:100%;background:${hz?"#c2121f":CH[a-1].c}"></div></div>
      <div class="qrow">
        <div class="buddy"><div class="bubble" id="bb">${idx===0?(hz?"…にげられるかな？":"がんばって！"):""}</div>${chrSVG(buddy,combo>=3?"dance":"")}</div>
        <div class="card pop" id="cd"><div class="eq">${eq}</div>
          <div class="yomi" id="ym">${save.yomi&&opt.ordered?YOMI[a-1][b-1].replace(/[がじゅう].*$/,"…"):"&nbsp;"}</div></div>
      </div>
      <div class="choices">${ch.map(x=>`<button class="ch" data-v="${x}">${x}</button>`).join("")}</div>
    </div>`);
    if(combo>=3)setMood(app.querySelector(".buddy .chr"),"happy");
    bk.onclick=()=>{clearInterval(timer);opt.buddy!=null?menu(opt.dans[0]):home()};
    app.querySelectorAll(".ch").forEach(btn=>btn.onclick=()=>answer(btn,+btn.dataset.v));
    clearInterval(timer);
    timer=setInterval(()=>{left-=.1;const el=document.getElementById("tb");if(el)el.style.width=Math.max(0,left/limit*100)+"%";if(left<=0)answer(null,-1)},100);
  }
  function answer(btn,v){
    if(locked)return;locked=true;clearInterval(timer);
    const q=qs[idx],[a,b]=q,ans=ansOf(q),ok=v===ans,k=missKey(a,b);
    log.push({a,b,ok});
    const qa=document.getElementById("qa");qa.textContent=ans;qa.classList.add("shown");qa.style.color=ok?"var(--good)":"var(--bad)";
    document.getElementById("ym").textContent=YOMI[a-1][b-1];
    app.querySelectorAll(".ch").forEach(x=>{if(+x.dataset.v===ans)x.classList.add("ok")});
    const bd=app.querySelector(".buddy .chr"),bb=document.getElementById("bb");
    if(ok){score++;combo++;best=Math.max(best,combo);
      hit(buddy);SE.ok();
      bd.classList.remove("sad");bd.classList.add("dance");setMood(bd,buddy===6?"sing":"happy");
      bb.textContent=combo>=3?pick(hz?HHOT:HOT):pick(hz?HCHEER:CHEER);
      if(save.miss[k])save.miss[k]=Math.max(0,save.miss[k]-1);}
    else{combo=0;if(btn)btn.classList.add("ng");save.miss[k]=(save.miss[k]||0)+2;
      if(opt.survival)lives--;
      if(hz){scare(buddy);setMood(bd,"happy")}else{SE.ng();bd.classList.remove("dance");bd.classList.add("sad");setMood(bd,"sad")}
      bb.textContent=left<=0?(hz?"…じかんぎれ…":"じかん ぎれ…"):pick(hz?HOOPS:OOPS);
      document.getElementById("cd").classList.add("shake");setTimeout(()=>sayKuku(a,b),hz?700:0);}
    bb.classList.remove("pop");void bb.offsetWidth;bb.classList.add("pop");
    persist();
    const over=opt.survival?lives<=0:idx+1>=qs.length;
    setTimeout(()=>{idx++;over?finish():draw()},ok?800:2100);
  }
  function finish(){
    const sec=Math.round((Date.now()-t0)/1000),n=log.length;
    let st=0,newRec=false,joined=false,awakened=false,rec="";
    if(opt.survival){ if(score>(save.hbest||0)){save.hbest=score;newRec=true;persist()} rec=`いきのこった もんだい ${score}もん${newRec?" ・ さいこう きろく！":""}（さいこう ${save.hbest}）`; st=score>=40?3:score>=25?2:score>=12?1:0; }
    else{
      if(opt.hard==="fill"){st=score===n&&sec<=n*5?3:score>=18?2:score>=14?1:0;if(st>(save.hst||0)){save.hst=st;newRec=true;persist()}}
      else{ if(score>=Math.ceil(n*.7))st=1; if(score>=n-1)st=2; if(score===n&&sec<=n*4+4)st=3; else if(score===n)st=Math.max(st,2); }
      if(opt.starFor){const prev=save.stars[opt.starFor]||0,was=allClear();if(st>prev){save.stars[opt.starFor]=st;newRec=true;joined=prev===0;persist();awakened=!was&&allClear()}}
    }
    const good=opt.survival?score>=12:score>=n*.7;
    const msg=hz?(good?"…なかなか やるね… ククク":"…また あそぼうね… ヒヒヒ"):(score===n?"かんぺき！すごい！":good?"よく できました！":"もう いっかい やってみよう！");
    h(`<div class="screen">
      ${joined?`<div class="join pop">${chrSVG(buddy,"dance m-happy")}<h2>${CH[buddy].n}が なかまに なった！</h2><p>${CH[buddy].inst}たんとう。ホームの ステージで えんそう できるよ</p></div>`:""}
      ${awakened?`<div class="awake"><h2>…なにかが めざめた…</h2><p>9にん ぜんいん そろった。ホームに「くくマスター ホラーモード」が あらわれたよ… こわくなければ おしてみて…</p></div>`:""}
      <div class="card pop">
        ${joined?"":chrSVG(buddy,good?"dance":(hz?"":"sad"),"--s:130px")}
        ${starHtml(st).replace('class="stars"','class="stars" style="font-size:56px"')}
        <div class="eq" style="font-size:clamp(40px,9vw,64px)">${opt.survival?`${score} もん`:`${score} / ${n}`}</div>
        <div class="yomi">${msg}</div>
        <p class="note">${rec||`じかん ${sec}びょう ・ さいだい ${best}れんぞく${newRec&&!joined?" ・ ★ほしを ゲット！":""}`}</p>
        <div class="list">${log.map(l=>`<div class="${l.ok?"":"miss"}">${l.ok?"⭕":"❌"} ${l.a}×${l.b}=${l.a*l.b}</div>`).join("")}</div>
      </div>
      <div class="row"><button class="big" id="again">もう いっかい</button><button class="big" id="hm">ホームへ</button></div>
    </div>`);
    const c=app.querySelector(".card .chr")||app.querySelector(".chr");setMood(c,good?(buddy===6?"sing":"happy"):(hz?"happy":"sad"));
    if(joined){Eng.start(new Set([buddy]));setTimeout(()=>{if(Eng.playing)Eng.stop()},STEP*16*2*1000)}
    else if(good)hit(buddy); else SE.fin();
    if(good&&!joined)setTimeout(SE.fin,600);
    if(awakened)setTimeout(()=>{if(ensureAC())scream()},1500);
    again.onclick=()=>quiz(opt);
    hm.onclick=home;
  }
  draw();
}
home();
</script>
