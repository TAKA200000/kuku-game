<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>くくマスター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* layout: 1画面アプリ。ホーム=くくバンドのステージ+段の格子 / プレイ=キャラ+問題+4択。単一テーマ(空色) */
:root{
  --sky:#bfe6ff; --sky2:#e8f6ff; --ink:#23324a; --paper:#fffdf6;
  --good:#2fb36d; --bad:#ef5b5b; --gold:#ffbf2e; --shadow:#23324a33;
  --stage:#2a2350; --stage2:#463a86;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --beat:.6s;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky),var(--sky2));color:var(--ink);font-family:var(--font);font-weight:800;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;overflow-x:hidden}
button{font-family:inherit;font-weight:800;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none;padding:0}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.screen{max-width:860px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px;min-height:100%}
h1{margin:0;font-size:clamp(30px,6vw,48px);letter-spacing:.04em;text-align:center;text-wrap:balance}
h1 small{display:block;font-size:.4em;font-weight:500;letter-spacing:.1em;opacity:.75}
.sub{text-align:center;font-weight:500;margin:0}

/* ---- キャラクター ---- */
.chr{position:relative;width:var(--s,110px);flex:none}
.chr svg{display:block;width:100%;height:auto;overflow:visible}
.chr .bg{transform-origin:60px 124px;animation:bob 2.6s ease-in-out infinite}
.chr .eyes{animation:blink 4.6s infinite}
.chr .ant{animation:wob 1.4s ease-in-out infinite}
.chr .mo,.chr .sadx{display:none}
.chr.m-idle .mo-idle,.chr.m-happy .mo-happy,.chr.m-sad .mo-sad,.chr.m-sing .mo-sing{display:inline}
.chr.m-sad .sadx{display:inline}
.chr.dance .bg{animation:dance var(--beat) ease-in-out infinite}
.chr.dance .al{animation:wl var(--beat) ease-in-out infinite}
.chr.dance .ar{animation:wr var(--beat) ease-in-out infinite}
.chr.dance .ant{animation:wob calc(var(--beat)/2) ease-in-out infinite}
.chr.sad .bg{animation:flop .9s ease-out forwards}
.chr.locked svg{filter:brightness(0) invert(1) opacity(.2)}
.chr.locked .bg,.chr.locked .eyes{animation:none}
.chr.locked::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--s,110px)*.38);color:#fff9;padding-top:12%}
.chr.muted{opacity:.4;filter:grayscale(.8)}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2px) scale(1.025,.975)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes dance{0%{transform:translateY(0) scale(1.08,.9)}30%{transform:translateY(-12px) scale(.94,1.07) rotate(-4deg)}60%{transform:translateY(0) scale(1.05,.95)}80%{transform:translateY(-4px) rotate(4deg)}100%{transform:translateY(0) scale(1.08,.9)}}
@keyframes wl{0%,100%{transform:rotate(0)}50%{transform:rotate(55deg)}}
@keyframes wr{0%,100%{transform:rotate(0)}50%{transform:rotate(-55deg)}}
@keyframes flop{0%{transform:rotate(0)}30%{transform:rotate(-14deg) translateY(5px) scale(1.06,.88)}100%{transform:rotate(-7deg) translateY(3px) scale(1.02,.95)}}

/* ---- ステージ ---- */
.stage{background:radial-gradient(ellipse at 20% 0%,#ffffff22,transparent 45%),radial-gradient(ellipse at 80% 0%,#ffd6f522,transparent 45%),linear-gradient(180deg,var(--stage2),var(--stage));
  border-radius:28px;padding:16px 12px 14px;color:#fff;box-shadow:0 8px 0 #1a1536;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.stage-top{display:flex;align-items:center;gap:12px;padding:0 6px}
.stage-top .nm{flex:1;display:flex;flex-direction:column}
.stage-top .nm b{font-size:24px;letter-spacing:.08em}
.stage-top .nm span{font-size:14px;font-weight:500;opacity:.8}
.playbtn{background:var(--gold);color:#3a2300;border-radius:99px;padding:12px 22px;font-size:20px;box-shadow:0 4px 0 #a7700f}
.playbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #a7700f}
.playbtn.on{background:#ff6fb5;color:#fff;box-shadow:0 4px 0 #a83a72}
.crew{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;align-items:end;
  background:linear-gradient(180deg,transparent 70%,#ffffff14 70%);border-radius:16px;padding:6px 2px 4px}
.mem{display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;min-width:0}
.mem .chr{--s:100%}
.mem span{font-size:12px;white-space:nowrap;opacity:.9}
.stage-tip{margin:0;text-align:center;font-weight:500;font-size:15px;min-height:1.5em}
@media (max-width:640px){.crew{grid-template-columns:repeat(5,1fr);row-gap:8px}}

/* ---- ホーム ---- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dan{background:var(--c);border-radius:22px;padding:10px 10px 8px;box-shadow:0 6px 0 var(--shadow);display:grid;grid-template-columns:1fr auto;align-items:center;transition:transform .08s;text-align:left}
.dan:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.dan .num{display:flex;flex-direction:column;line-height:1}
.dan b{font-size:clamp(36px,8vw,56px)}
.dan small{font-size:14px;margin-top:2px}
.dan .chr{--s:clamp(44px,11vw,72px)}
.dan .stars{grid-column:1/3;margin-top:2px}
.stars{font-size:20px;letter-spacing:2px;color:#0002}
.stars i{font-style:normal}.stars i.on{color:var(--gold);text-shadow:0 1px 0 #a7700f}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
.big{background:var(--paper);border-radius:20px;padding:16px;font-size:22px;box-shadow:0 6px 0 var(--shadow)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.big.dark{background:var(--ink);color:var(--paper)}
.top{display:flex;align-items:center;gap:10px}
.back{background:var(--paper);border-radius:14px;padding:10px 16px;font-size:18px;box-shadow:0 4px 0 var(--shadow)}
.top .ttl{flex:1;text-align:center;font-size:22px}
.spacer{width:90px}
.card{background:var(--paper);border-radius:28px;padding:24px 16px;box-shadow:0 8px 0 var(--shadow);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;min-width:0}
.eq{font-size:clamp(48px,12vw,100px);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.eq .q{display:inline-block;min-width:1.4em;border-bottom:6px dashed #23324a55;color:#23324a55}
.yomi{font-size:clamp(20px,4.5vw,32px);font-weight:500;letter-spacing:.06em;color:#c0567a;min-height:1.3em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ch{background:var(--paper);border-radius:22px;font-size:clamp(40px,10vw,64px);padding:16px 0;box-shadow:0 6px 0 var(--shadow);font-variant-numeric:tabular-nums}
.ch:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.ch.ok{background:var(--good);color:#fff}.ch.ng{background:var(--bad);color:#fff}
.bar{height:16px;background:#ffffff99;border-radius:99px;overflow:hidden}
.bar>div{height:100%;border-radius:99px;transition:width .2s linear}
.hud{display:flex;justify-content:space-between;font-size:20px;font-variant-numeric:tabular-nums}
.combo{color:#e2741d}
.qrow{display:flex;align-items:center;gap:10px}
.qrow .card{flex:1}
.buddy{position:relative;display:flex;flex-direction:column;align-items:center}
.buddy .chr{--s:clamp(84px,22vw,180px)}
.qrow .eq{font-size:clamp(38px,8.5vw,86px)}
.qrow .card{padding-inline:10px}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-30%);background:#fff;border-radius:16px;padding:6px 12px;font-size:18px;white-space:nowrap;box-shadow:0 3px 0 var(--shadow);z-index:2}
.bubble::after{content:"";position:absolute;left:24%;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble:empty{display:none}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.bubble.pop{animation:bpop .35s}
@keyframes bpop{0%{transform:translateX(-30%) scale(.6)}60%{transform:translateX(-30%) scale(1.1)}100%{transform:translateX(-30%) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%}
.list div{background:#fff;border-radius:12px;padding:8px;font-size:20px}
.list div.miss{background:#ffe1e1}
.toggle{background:#ffffffaa;border-radius:14px;padding:10px 14px;font-size:18px}
.pick{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.pick button{background:var(--paper);border-radius:12px;padding:10px 0;font-size:20px;box-shadow:0 3px 0 var(--shadow)}
.pick button.cur{background:var(--c);transform:translateY(2px)}
.note{font-weight:500;font-size:15px;text-align:center;opacity:.8;margin:0}
.join{background:radial-gradient(circle at 50% 40%,#fff6c9,#ffe07a 60%,#ffbf2e);border-radius:28px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 #c98a12}
.join .chr{--s:170px}
.join h2{margin:0;font-size:clamp(24px,5vw,34px);text-align:center;text-wrap:balance}
.join p{margin:0;font-weight:500}
.menuhead{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
.menuhead .chr{--s:130px}
@media (max-width:420px){.grid{gap:8px}.pick{grid-template-columns:repeat(5,1fr)}.spacer{width:0}}
@media (prefers-reduced-motion:reduce){.pop,.shake,.chr .bg,.chr .eyes,.chr .ant,.chr .al,.chr .ar{animation:none!important}.bar>div{transition:none}}
</style>
</head>

  const normal=x=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*1.18}" fill="#fff"/><ellipse cx="${x+r*.12}" cy="${y+r*.2}" rx="${r*.6}" ry="${r*.72}" fill="#1b2135"/><circle cx="${x+r*.32}" cy="${y-r*.12}" r="${r*.27}" fill="#fff"/><circle cx="${x-r*.1}" cy="${y+r*.5}" r="${r*.13}" fill="#fff"/>`;

/* ================= 音 ================= */
let ac=null,master=null,noiseBuf=null;
function ensureAC(){ try{
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  if(ac.state==="suspended")ac.resume();
  master.gain.value=save.sound?.8:0; return true;
}catch(e){return false} }
const mtof=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,peak,dur){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function osc(type,f,t,dur,peak,dest,a=.008){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);env(g,t,a,peak,dur);o.connect(g).connect(dest||master);o.start(t);o.stop(t+dur+.05);return o}
function noise(t,dur,peak,ft,ff,q=1){const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;f.type=ft;f.frequency.value=ff;f.Q.value=q;env(g,t,.003,peak,dur);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur+.05)}
function filt(type,f,q=1){const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;b.connect(master);return b}
const BPM=100,STEP=60/BPM/4;
const CHORD=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],ROOT=[36,33,29,31];
const _=null;
const MEL=[[72,_,_,76,_,_,79,_,76,_,74,_,72,_,_,_],[69,_,72,_,76,_,_,74,72,_,_,69,_,_,_,_],[65,_,69,_,72,_,_,77,76,_,74,_,72,_,_,_],[74,_,_,71,_,_,74,_,79,_,77,_,76,_,74,_]];
const TR=[
 (t,s)=>{ if(s%4===0){const o=osc("sine",160,t,.42,.95);o.frequency.exponentialRampToValueAtTime(42,t+.13);noise(t,.02,.25,"highpass",3000)} },
 (t,s,b)=>{ if(s===4||s===12){noise(t,.16,.55,"bandpass",1500,.9);noise(t+.012,.12,.4,"bandpass",1200,.9);noise(t+.024,.2,.5,"bandpass",1400,.7)} if(b===3&&s===14)noise(t,.1,.25,"bandpass",1500,.9) },
 (t,s,b)=>{ if([0,3,6,8,11,14].includes(s)){const f=filt("lowpass",520,4);const o=osc("sawtooth",mtof(ROOT[b]+12+(s===11?12:0)),t,.24,.32,f);osc("sine",mtof(ROOT[b]+12),t,.26,.35)} },
 (t,s)=>{ if(s%2===0)noise(t,s%4===2?.07:.035,s%4===2?.28:.12,"highpass",7500) },
 (t,s,b)=>{ if(s===0)CHORD[b].forEach(n=>{[0,7].forEach(dt=>{const o=osc("triangle",mtof(n+12),t,STEP*16,.045,null,.35);o.detune.value=dt})}) },
 (t,s,b)=>{ const n=MEL[b][s]; if(n){const f=filt("lowpass",2400,2);osc("square",mtof(n),t,.26,.11,f);osc("triangle",mtof(n+12),t,.2,.04)} },
 (t,s,b)=>{ const map={8:0,10:1,12:2,14:1}; if(b%2===1&&s in map||b%2===0&&s===8){const n=CHORD[b][map[s]]+12;
   const o=ac.createOscillator(),g=ac.createGain(),f1=ac.createBiquadFilter(),f2=ac.createBiquadFilter(),lfo=ac.createOscillator(),lg=ac.createGain();
   o.type="sawtooth";o.frequency.value=mtof(n);lfo.frequency.value=5.5;lg.gain.value=mtof(n)*.012;lfo.connect(lg).connect(o.frequency);
   f1.type=f2.type="bandpass";f1.frequency.value=780;f2.frequency.value=1150;f1.Q.value=6;f2.Q.value=8;
   const dur=s===8&&b%2===0?.5:.28;env(g,t,.04,.5,dur);o.connect(f1);o.connect(f2);f1.connect(g);f2.connect(g);g.connect(master);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05)} },
 (t,s,b)=>{ if(s%2===1){const n=CHORD[b][(s>>1)%3]+24;osc("sine",mtof(n),t,.5,.06);osc("sine",mtof(n)*2.76,t,.18,.02)} },
 (t,s,b)=>{ if(s===6||s===10||(b===3&&s===15)){const f=ac.createBiquadFilter();f.type="lowpass";f.Q.value=3;f.frequency.setValueAtTime(3200,t);f.frequency.exponentialRampToValueAtTime(500,t+.2);f.connect(master);CHORD[b].forEach(n=>osc("sawtooth",mtof(n+12),t,.2,.06,f))} }

const Eng={playing:false,set:new Set(),step:0,next:0,timer:null,
  start(set){ if(!ensureAC())return; this.set=set; if(this.playing)return; this.playing=true;this.step=0;this.next=ac.currentTime+.06;
    this.timer=setInterval(()=>this.tick(),25); },
  stop(){this.playing=false;clearInterval(this.timer)},
  tick(){ while(this.next<ac.currentTime+.12){const s=this.step%16,b=(this.step>>4)%4;this.set.forEach(i=>{try{TR[i](this.next,s,b)}catch(e){}});this.next+=STEP;this.step++} }
};
function hit(i,bar=0){ if(!ensureAC())return; const t0=ac.currentTime+.03; for(let s=0;s<8;s++){try{TR[i](t0+s*STEP*.85,s+(i===6?8:0),i===6?1:bar)}catch(e){}} }
function tone(seq){ if(!ensureAC())return; let t=ac.currentTime; seq.forEach(([f,d,type])=>{osc(type||"triangle",f,t,d,.16);t+=d*.8}) }
const SE={ok:()=>tone([[880,.1],[1320,.16]]),ng:()=>tone([[220,.25,"square"],[180,.3,"square"]]),fin:()=>tone([[523,.15],[659,.15],[784,.15],[1047,.4]]),tap:()=>tone([[660,.06]])};
function speak(txt){ if(!save.sound)return; try{const u=new SpeechSynthesisUtterance(txt);u.lang="ja-JP";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){} }

/* ---- クイズ ---- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function makeChoices(a,b){
  const ans=a*b,set=new Set([ans]);
  const cands=[a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+1,ans-1,ans+10,ans-10,a*(b+2)].filter(x=>x>0&&x!==ans&&x<=90);
  shuffle(cands);for(const x of cands){if(set.size>=4)break;set.add(x)}
  while(set.size<4)set.add(1+(Math.random()*81|0));
  return shuffle([...set]);
}

  quiz({title:"にがて チャレンジ",fixed:list,n:list.length,color:"#ffc9b0",weak:true});
}
const CHEER=["いいね！","せいかい！","ナイス！","やったね！"],HOT=["ノってきた！","とまらない！","さいこう！","バンド もりあがり！"],OOPS=["どんまい！","つぎ いこう！","おしい！"];
function quiz(opt){
  let qs;
  if(opt.fixed)qs=shuffle(opt.fixed.slice());
  else if(opt.ordered)qs=[1,2,3,4,5,6,7,8,9].map(b=>[opt.dans[0],b]);
  else{const all=[];opt.dans.forEach(a=>{for(let b=1;b<=9;b++)all.push([a,b])});shuffle(all);qs=all.slice(0,opt.n);
    while(qs.length<opt.n)qs.push(all[Math.random()*all.length|0]);}
  const mates=CH.map((_,i)=>i).filter(unlocked);
  const buddy=opt.buddy!=null?opt.buddy:(mates.length?pick(mates):0);
  const LIMIT=10;
  let idx=0,score=0,combo=0,best=0,log=[],timer=null,left=LIMIT,t0=Date.now(),locked=false;
  function draw(){
    const [a,b]=qs[idx],ch=makeChoices(a,b);
    locked=false;left=LIMIT;
    h(`<div class="screen">
      <div class="top"><button class="back" id="bk">← やめる</button><div class="ttl">${opt.title}</div><span class="spacer"></span></div>
      <div class="hud"><span>${idx+1} / ${qs.length} もん</span><span class="combo">${combo>=2?combo+" れんぞく！":""}</span><span>⭕ ${score}</span></div>
      <div class="bar"><div id="tb" style="width:100%;background:${CH[a-1].c}"></div></div>
      <div class="qrow">
        <div class="buddy"><div class="bubble" id="bb">${idx===0?"がんばって！":""}</div>${chrSVG(buddy,combo>=3?"dance":"")}</div>
        <div class="card pop" id="cd"><div class="eq">${a} × ${b} = <span class="q" id="qa">?</span></div>
          <div class="yomi" id="ym">${save.yomi&&opt.ordered?YOMI[a-1][b-1].replace(/[がじゅう].*$/,"…"):"&nbsp;"}</div></div>
      </div>
      <div class="choices">${ch.map(x=>`<button class="ch" data-v="${x}">${x}</button>`).join("")}</div>
    </div>`);
    if(combo>=3)setMood(app.querySelector(".buddy .chr"),"happy");
    bk.onclick=()=>{clearInterval(timer);opt.buddy!=null?menu(opt.dans[0]):home()};
    app.querySelectorAll(".ch").forEach(btn=>btn.onclick=()=>answer(btn,+btn.dataset.v));
    clearInterval(timer);
    timer=setInterval(()=>{left-=.1;const el=document.getElementById("tb");if(el)el.style.width=Math.max(0,left/LIMIT*100)+"%";if(left<=0)answer(null,-1)},100);
  }
  function answer(btn,v){
    if(locked)return;locked=true;clearInterval(timer);
    const [a,b]=qs[idx],ans=a*b,ok=v===ans,k=missKey(a,b);
    log.push({a,b,ok});
    const qa=document.getElementById("qa");qa.textContent=ans;qa.style.color=ok?"var(--good)":"var(--bad)";qa.style.borderColor="transparent";
    document.getElementById("ym").textContent=YOMI[a-1][b-1];
    app.querySelectorAll(".ch").forEach(x=>{if(+x.dataset.v===ans)x.classList.add("ok")});
    const bd=app.querySelector(".buddy .chr"),bb=document.getElementById("bb");
    if(ok){score++;combo++;best=Math.max(best,combo);
      hit(buddy,(a+b)%4);SE.ok();
      bd.classList.remove("sad");bd.classList.add("dance");setMood(bd,buddy===6?"sing":"happy");
      bb.textContent=combo>=3?pick(HOT).replace("！",combo>=5?"！！":"！"):pick(CHEER);
      if(save.miss[k])save.miss[k]=Math.max(0,save.miss[k]-1);}
    else{combo=0;SE.ng();if(btn)btn.classList.add("ng");save.miss[k]=(save.miss[k]||0)+2;
      bd.classList.remove("dance");bd.classList.add("sad");setMood(bd,"sad");bb.textContent=left<=0?"じかん ぎれ…":pick(OOPS);
      document.getElementById("cd").classList.add("shake");speak(YOMI[a-1][b-1]);}
    bb.classList.remove("pop");void bb.offsetWidth;bb.classList.add("pop");
    persist();
    setTimeout(()=>{idx++;idx<qs.length?draw():finish()},ok?800:2000);
  }
  function finish(){
    const sec=Math.round((Date.now()-t0)/1000),n=qs.length;
    let st=0;
    if(score>=Math.ceil(n*.7))st=1; if(score>=n-1)st=2; if(score===n&&sec<=n*4+4)st=3; else if(score===n)st=Math.max(st,2);
    let newRec=false,joined=false;
    if(opt.starFor){const prev=save.stars[opt.starFor]||0;if(st>prev){save.stars[opt.starFor]=st;newRec=true;joined=prev===0;persist();}}
    const msg=score===n?"かんぺき！すごい！":score>=n*.7?"よく できました！":"もう いっかい やってみよう！";
    const good=score>=n*.7;
    h(`<div class="screen">
      ${joined?`<div class="join pop">${chrSVG(buddy,"dance m-happy")}<h2>${CH[buddy].n}が なかまに なった！</h2><p>${CH[buddy].inst}たんとう。ホームの ステージで えんそう できるよ</p></div>`:""}
      <div class="card pop">
        ${joined?"":chrSVG(buddy,good?"dance":"sad","--s:130px")}
        ${starHtml(st).replace('class="stars"','class="stars" style="font-size:56px"')}
        <div class="eq" style="font-size:clamp(40px,9vw,64px)">${score} / ${n}</div>
        <div class="yomi" style="color:var(--ink)">${msg}</div>
        <p class="note">じかん ${sec}びょう ・ さいだい ${best}れんぞく${newRec&&!joined?" ・ ★ほしを ゲット！":""}</p>
        <div class="list">${log.map(l=>`<div class="${l.ok?"":"miss"}">${l.ok?"⭕":"❌"} ${l.a}×${l.b}=${l.a*l.b}</div>`).join("")}</div>
      </div>
      <div class="row"><button class="big" style="background:${opt.color}" id="again">もう いっかい</button><button class="big" id="hm">ホームへ</button></div>
    </div>`);
    const c=app.querySelector(".chr");setMood(c,good?(buddy===6?"sing":"happy"):"sad");
    if(joined){Eng.start(new Set([buddy]));setTimeout(()=>{if(Eng.playing)Eng.stop()},STEP*16*2*1000)}
    else if(good)hit(buddy); else SE.fin();
    if(good&&!joined)setTimeout(SE.fin,600);
    again.onclick=()=>quiz(opt);
    hm.onclick=home;
  }
  draw();
}
home();
</script>
</body>
</html>
