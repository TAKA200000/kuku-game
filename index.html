<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>くくマスター</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* layout: 1画面アプリ。ホーム=段のステッカー格子 / プレイ=大きな問題+4択ボタン。単一テーマ(空色) */
:root{
  --sky:#bfe6ff; --sky2:#e8f6ff; --ink:#23324a; --paper:#fffdf6;
  --good:#2fb36d; --bad:#ef5b5b; --gold:#ffbf2e; --shadow:#23324a33;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky),var(--sky2));color:var(--ink);font-family:var(--font);font-weight:800;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;overflow-x:hidden}
button{font-family:inherit;font-weight:800;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.screen{max-width:820px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:18px;min-height:100%}
h1{margin:0;font-size:clamp(34px,7vw,56px);letter-spacing:.04em;text-align:center;text-wrap:balance}
h1 small{display:block;font-size:.36em;font-weight:500;letter-spacing:.1em;opacity:.75}
.sub{text-align:center;font-weight:500;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dan{background:var(--c);border-radius:22px;padding:14px 8px 10px;box-shadow:0 6px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.dan:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.dan b{font-size:clamp(40px,9vw,64px);line-height:1}
.dan span{font-size:15px}
.stars{font-size:20px;letter-spacing:2px;color:#0002}
.stars i{font-style:normal}.stars i.on{color:var(--gold);text-shadow:0 1px 0 #a7700f}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
.big{background:var(--paper);border-radius:20px;padding:16px;font-size:22px;box-shadow:0 6px 0 var(--shadow)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.big.dark{background:var(--ink);color:var(--paper)}
.top{display:flex;align-items:center;gap:10px}
.back{background:var(--paper);border-radius:14px;padding:10px 16px;font-size:18px;box-shadow:0 4px 0 var(--shadow)}
.top .ttl{flex:1;text-align:center;font-size:24px}
.card{background:var(--paper);border-radius:28px;padding:28px 16px;box-shadow:0 8px 0 var(--shadow);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.eq{font-size:clamp(56px,14vw,104px);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.eq .q{display:inline-block;min-width:1.4em;border-bottom:6px dashed #23324a55;color:#23324a55}
.yomi{font-size:clamp(22px,5vw,34px);font-weight:500;letter-spacing:.06em;color:var(--c,#555)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ch{background:var(--paper);border-radius:22px;font-size:clamp(40px,10vw,64px);padding:18px 0;box-shadow:0 6px 0 var(--shadow);font-variant-numeric:tabular-nums}
.ch:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.ch.ok{background:var(--good);color:#fff}.ch.ng{background:var(--bad);color:#fff}
.bar{height:16px;background:#ffffff99;border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--c,var(--gold));border-radius:99px;transition:width .2s linear}
.hud{display:flex;justify-content:space-between;font-size:20px;font-variant-numeric:tabular-nums}
.combo{color:#e2741d}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.result .bigstars{font-size:64px;letter-spacing:6px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;width:100%}
.list div{background:#fff;border-radius:12px;padding:8px;font-size:20px}
.list div.miss{background:#ffe1e1}
.toggle{background:#ffffffaa;border-radius:14px;padding:10px 14px;font-size:18px}
.pick{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.pick button{background:var(--paper);border-radius:12px;padding:10px 0;font-size:20px;box-shadow:0 3px 0 var(--shadow)}
.pick button.cur{background:var(--c);transform:translateY(2px)}
.note{font-weight:500;font-size:15px;text-align:center;opacity:.8;margin:0}
@media (max-width:420px){.grid{gap:10px}.pick{grid-template-columns:repeat(5,1fr)}}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}.bar>div{transition:none}}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div id="app"></div>

<script>
const COLORS=["#ffd6e0","#ffe0a8","#fff1a1","#c9f2b5","#b5eedd","#b8dcff","#d4c8ff","#f5c6f0","#ffc9b0"];
const YOMI=[
["いんいちがいち","いんにがに","いんさんがさん","いんしがし","いんごがご","いんろくがろく","いんしちがしち","いんはちがはち","いんくがく"],
["にいちがに","ににんがし","にさんがろく","にしがはち","にごじゅう","にろくじゅうに","にしちじゅうし","にはちじゅうろく","にくじゅうはち"],
["さんいちがさん","さんにがろく","さざんがく","さんしじゅうに","さんごじゅうご","さぶろくじゅうはち","さんしちにじゅういち","さんぱにじゅうし","さんくにじゅうしち"],
["しいちがし","しにがはち","しさんじゅうに","ししじゅうろく","しごにじゅう","しろくにじゅうし","ししちにじゅうはち","しはさんじゅうに","しくさんじゅうろく"],
["ごいちがご","ごにじゅう","ごさんじゅうご","ごしにじゅう","ごごにじゅうご","ごろくさんじゅう","ごしちさんじゅうご","ごはしじゅう","ごっくしじゅうご"],
["ろくいちがろく","ろくにじゅうに","ろくさんじゅうはち","ろくしにじゅうし","ろくごさんじゅう","ろくろくさんじゅうろく","ろくしちしじゅうに","ろくはしじゅうはち","ろっくごじゅうし"],
["しちいちがしち","しちにじゅうし","しちさんにじゅういち","しちしにじゅうはち","しちごさんじゅうご","しちろくしじゅうに","しちしちしじゅうく","しちはごじゅうろく","しちくろくじゅうさん"],
["はちいちがはち","はちにじゅうろく","はちさんにじゅうし","はちしさんじゅうに","はちごしじゅう","はちろくしじゅうはち","はちしちごじゅうろく","はっぱろくじゅうし","はっくしちじゅうに"],
["くいちがく","くにじゅうはち","くさんにじゅうしち","くしさんじゅうろく","くごしじゅうご","くろくごじゅうし","くしちろくじゅうさん","くはしちじゅうに","くくはちじゅういち"]];
const KEY="kuku-v1";
let save={stars:{},miss:{},sound:true,yomi:true};
try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}

/* --- 音 --- */
let ac=null;
function tone(seq){ if(!save.sound)return; try{
  ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended")ac.resume();
  let t=ac.currentTime;
  seq.forEach(([f,d,type])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||"triangle";o.frequency.value=f;
    g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);t+=d*.8;});
}catch(e){} }
const SE={ok:()=>tone([[880,.12],[1320,.2]]),ng:()=>tone([[220,.25,"square"]]),fin:()=>tone([[523,.15],[659,.15],[784,.15],[1047,.4]]),tap:()=>tone([[660,.06]])};
function speak(txt){ if(!save.sound)return; try{const u=new SpeechSynthesisUtterance(txt);u.lang="ja-JP";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){} }

const app=document.getElementById("app");
const h=(s)=>{app.innerHTML=s;window.scrollTo(0,0)};
const starHtml=n=>`<span class="stars">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}">★</i>`).join("")}</span>`;
const missKey=(a,b)=>a+"x"+b;

/* --- ホーム --- */
function home(){
  const total=Object.values(save.stars).reduce((s,v)=>s+v,0);
  h(`<div class="screen">
    <h1><small>たのしく おぼえよう</small>くくマスター</h1>
    <p class="sub">あつめた ほし ★ ${total} / 27</p>
    <div class="grid">${COLORS.map((c,i)=>`<button class="dan" style="--c:${c}" data-d="${i+1}"><b>${i+1}</b><span>のだん</span>${starHtml(save.stars[i+1]||0)}</button>`).join("")}</div>
    <div class="row">
      <button class="big dark" id="mix">ぜんぶ ミックス</button>
      <button class="big" id="weak">にがて チャレンジ</button>
    </div>
    <div class="row"><button class="toggle" id="snd">おと：${save.sound?"オン":"オフ"}</button></div>
  </div>`);
  app.querySelectorAll(".dan").forEach(b=>b.onclick=()=>{SE.tap();menu(+b.dataset.d)});
  mix.onclick=()=>{SE.tap();quiz({title:"ぜんぶ ミックス",dans:[1,2,3,4,5,6,7,8,9],n:15,color:"#ffe0a8"})};
  weak.onclick=()=>{SE.tap();weakQuiz()};
  snd.onclick=()=>{save.sound=!save.sound;persist();home()};
}

/* --- 段メニュー --- */
function menu(d){
  const c=COLORS[d-1];
  h(`<div class="screen">
    <div class="top"><button class="back" id="bk">← もどる</button><div class="ttl">${d} のだん</div><span style="width:90px"></span></div>
    <div class="card" style="--c:${c}">
      <div class="eq" style="font-size:clamp(48px,11vw,80px)">${d} × □</div>
      ${starHtml(save.stars[d]||0)}
      <p class="note">★1 = 7もん いじょう ／ ★2 = 9もん いじょう ／ ★3 = ぜんもん せいかい ＋ はやい</p>
    </div>
    <button class="big" style="background:${c}" id="learn">① おぼえる（となえる）</button>
    <button class="big" style="background:${c}" id="order">② じゅんばん チャレンジ</button>
    <button class="big dark" id="rand">③ バラバラ チャレンジ ★</button>
  </div>`);
  bk.onclick=home;
  learn.onclick=()=>{SE.tap();learnMode(d)};
  order.onclick=()=>{SE.tap();quiz({title:`${d}のだん じゅんばん`,dans:[d],n:9,ordered:true,color:c})};
  rand.onclick=()=>{SE.tap();quiz({title:`${d}のだん バラバラ`,dans:[d],n:10,color:c,starFor:d})};
}

/* --- おぼえるモード --- */
function learnMode(d){
  let i=1,hide=false; const c=COLORS[d-1];
  function draw(){
    h(`<div class="screen">
      <div class="top"><button class="back" id="bk">← もどる</button><div class="ttl">${d}のだん おぼえる</div><span style="width:90px"></span></div>
      <div class="pick" style="--c:${c}">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-k="${k}" class="${k===i?"cur":""}">${k}</button>`).join("")}</div>
      <div class="card" id="cd" style="--c:#c0567a">
        <div class="eq">${d} × ${i} = ${hide?`<span class="q">?</span>`:d*i}</div>
        <div class="yomi">${hide?"・・・":YOMI[d-1][i-1]}</div>
      </div>
      <div class="row">
        <button class="big" id="prev">← まえ</button>
        <button class="big" style="background:${c}" id="say">こえで きく</button>
        <button class="big" id="next">つぎ →</button>
      </div>
      <div class="row"><button class="toggle" id="hd">こたえを ${hide?"みせる":"かくす"}</button></div>
      <p class="note">「こたえを かくす」にして、こえに だして いってから「みせる」で たしかめよう</p>
    </div>`);
    bk.onclick=()=>menu(d);
    prev.onclick=()=>{i=i>1?i-1:9;draw();auto()};
    next.onclick=()=>{i=i<9?i+1:1;draw();auto()};
    say.onclick=()=>speak(YOMI[d-1][i-1]);
    hd.onclick=()=>{hide=!hide;draw()};
    cd.onclick=()=>{if(hide){hide=false;draw();speak(YOMI[d-1][i-1])}};
    app.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>{i=+b.dataset.k;draw();auto()});
  }
  function auto(){ if(!hide)speak(YOMI[d-1][i-1]); }
  draw();
}

/* --- クイズ --- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function makeChoices(a,b){
  const ans=a*b,set=new Set([ans]);
  const cands=[a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,ans+1,ans-1,ans+10,ans-10,a*(b+2)].filter(x=>x>0&&x!==ans&&x<=90);
  shuffle(cands);for(const x of cands){if(set.size>=4)break;set.add(x)}
  while(set.size<4)set.add(1+(Math.random()*81|0));
  return shuffle([...set]);
}
function weakQuiz(){
  const list=Object.entries(save.miss).filter(([,v])=>v>0).sort((x,y)=>y[1]-x[1]).slice(0,10).map(([k])=>k.split("x").map(Number));
  if(!list.length){
    h(`<div class="screen"><div class="top"><button class="back" id="bk">← もどる</button><div class="ttl">にがて チャレンジ</div><span style="width:90px"></span></div>
      <div class="card"><div class="eq" style="font-size:56px">にがて なし！</div><p class="note">まちがえた もんだいが ここに あつまるよ。まずは だんの チャレンジを やってみよう。</p></div></div>`);
    bk.onclick=home;return;
  }
  quiz({title:"にがて チャレンジ",fixed:list,n:list.length,color:"#ffc9b0",weak:true});
}
function quiz(opt){
  let qs;
  if(opt.fixed)qs=shuffle(opt.fixed.slice());
  else if(opt.ordered)qs=[1,2,3,4,5,6,7,8,9].map(b=>[opt.dans[0],b]);
  else{const all=[];opt.dans.forEach(a=>{for(let b=1;b<=9;b++)all.push([a,b])});shuffle(all);qs=all.slice(0,opt.n);
    while(qs.length<opt.n)qs.push(all[Math.random()*all.length|0]);}
  const LIMIT=10; // 1問の秒数
  let idx=0,score=0,combo=0,best=0,log=[],timer=null,left=LIMIT,t0=Date.now(),locked=false;
  function draw(){
    const [a,b]=qs[idx],ch=makeChoices(a,b);
    locked=false;left=LIMIT;
    h(`<div class="screen" style="--c:${opt.color}">
      <div class="top"><button class="back" id="bk">← やめる</button><div class="ttl">${opt.title}</div><span style="width:90px"></span></div>
      <div class="hud"><span>${idx+1} / ${qs.length} もん</span><span class="combo">${combo>=2?combo+" れんぞく！":""}</span><span>⭕ ${score}</span></div>
      <div class="bar"><div id="tb" style="width:100%;background:${COLORS[a-1]}"></div></div>
      <div class="card pop" id="cd"><div class="eq">${a} × ${b} = <span class="q" id="qa">?</span></div>
        <div class="yomi" id="ym" style="--c:#c0567a">${save.yomi&&opt.ordered?YOMI[a-1][b-1].replace(/[がじゅう].*$/,"…"):"&nbsp;"}</div></div>
      <div class="choices">${ch.map(x=>`<button class="ch" data-v="${x}">${x}</button>`).join("")}</div>
    </div>`);
    bk.onclick=()=>{clearInterval(timer);opt.starFor?menu(opt.starFor):(opt.ordered?menu(opt.dans[0]):home())};
    app.querySelectorAll(".ch").forEach(btn=>btn.onclick=()=>answer(btn,+btn.dataset.v));
    clearInterval(timer);
    timer=setInterval(()=>{left-=.1;const el=document.getElementById("tb");if(el)el.style.width=Math.max(0,left/LIMIT*100)+"%";if(left<=0)answer(null,-1)},100);
  }
  function answer(btn,v){
    if(locked)return;locked=true;clearInterval(timer);
    const [a,b]=qs[idx],ans=a*b,ok=v===ans,k=missKey(a,b);
    log.push({a,b,ok});
    const qa=document.getElementById("qa");qa.textContent=ans;qa.style.color=ok?"var(--good)":"var(--bad)";qa.style.borderColor="transparent";
    document.getElementById("ym").textContent=YOMI[a-1][b-1];
    app.querySelectorAll(".ch").forEach(x=>{if(+x.dataset.v===ans)x.classList.add("ok")});
    if(ok){score++;combo++;best=Math.max(best,combo);SE.ok();
      if(save.miss[k])save.miss[k]=Math.max(0,save.miss[k]-1);
      document.getElementById("cd").classList.add("pop");}
    else{combo=0;SE.ng();if(btn)btn.classList.add("ng");save.miss[k]=(save.miss[k]||0)+2;
      document.getElementById("cd").classList.add("shake");speak(YOMI[a-1][b-1]);}
    persist();
    setTimeout(()=>{idx++;idx<qs.length?draw():finish()},ok?650:1900);
  }
  function finish(){
    const sec=Math.round((Date.now()-t0)/1000),n=qs.length;
    let st=0;
    if(score>=Math.ceil(n*.7))st=1; if(score>=n-1)st=2; if(score===n&&sec<=n*4+4)st=3; else if(score===n)st=Math.max(st,2);
    let newRec=false;
    if(opt.starFor&&st>(save.stars[opt.starFor]||0)){save.stars[opt.starFor]=st;newRec=true;persist();}
    SE.fin();
    const msg=score===n?"かんぺき！すごい！":score>=n*.7?"よく できました！":"もう いっかい やってみよう！";
    h(`<div class="screen result" style="--c:${opt.color}">
      <div class="card pop">
        <div class="bigstars">${starHtml(st).replace('class="stars"','class="stars" style="font-size:64px"')}</div>
        <div class="eq" style="font-size:clamp(40px,9vw,64px)">${score} / ${n}</div>
        <div class="yomi" style="--c:var(--ink)">${msg}</div>
        <p class="note">じかん ${sec}びょう ・ さいだい ${best}れんぞく${newRec?" ・ ★ほしを ゲット！":""}</p>
        <div class="list">${log.map(l=>`<div class="${l.ok?"":"miss"}">${l.ok?"⭕":"❌"} ${l.a}×${l.b}=${l.a*l.b}</div>`).join("")}</div>
      </div>
      <div class="row"><button class="big" style="background:${opt.color}" id="again">もう いっかい</button><button class="big" id="hm">ホームへ</button></div>
    </div>`);
    again.onclick=()=>quiz(opt);
    hm.onclick=home;
  }
  draw();
}
home();
</script>
</body>
</html>
